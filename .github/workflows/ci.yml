name: CI

on:
  pull_request:
  merge_group:

env:
  GH_TOKEN: ${{ github.token }}
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

defaults:
  run:
    shell: bash

jobs:
  run-hermit:
    name: Run
    runs-on: ${{ (matrix.arch == 'aarch64' || matrix.arch == 'aarch64_be') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    env:
      HERMIT_CAREFUL: ${{ matrix.hermit-careful }}
    defaults:
      run:
        working-directory: kernel
    strategy:
      matrix:
        arch: [riscv64]
        profile: [dev]
        include:
          - profile: dev
            hermit-careful: 1
          - arch: riscv64
            packages: qemu-system-riscv-hwe
            rs_flags: --features hermit/loader,hermit/semihosting

    steps:
      - name: Checkout hermit-rs
        uses: actions/checkout@v7
        with:
          repository: hermit-os/hermit-rs
      - name: Checkout hermit-kernel
        uses: actions/checkout@v7
        with:
          path: kernel
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends ipxe-qemu ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: mkroening/rust-toolchain-toml@main
      - uses: mkroening/rust-toolchain-toml@main
        with:
          toolchain-file: "kernel/rust-toolchain.toml"
      - name: Download loader
        run: gh release download --repo hermit-os/loader --pattern 'hermit-loader-${{ matrix.arch }}*'
      - uses: taiki-e/install-action@cargo-careful
        if: matrix.profile == 'dev'
      - run: cargo xtask ci rs --arch ${{ matrix.arch }} --profile ${{ matrix.profile }} ${{ matrix.rs_flags }} --package httpd --features ci,hermit/virtio-net qemu --sudo --devices virtio-net-pci --tap
      - run: cargo xtask ci rs --arch ${{ matrix.arch }} --profile ${{ matrix.profile }} ${{ matrix.rs_flags }} --package httpd --features ci,hermit/virtio-net qemu --sudo --devices virtio-net-pci --tap
