name: Examples

on:
  pull_request:
    paths:
      - benches/**
      - crates/hermit/**
      - crates/hermit-abi/**
      - examples/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/examples.yml
  workflow_dispatch:

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  format:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: mkroening/rust-toolchain-toml@main
      - run: rustup component add rustfmt
      - name: cargo fmt
        run: |
          for manifest in benches/*/Cargo.toml crates/hermit/Cargo.toml crates/hermit-abi/Cargo.toml examples/*/Cargo.toml; do
            cargo fmt --check --manifest-path "$manifest"
          done

  clippy:
    name: Clippy (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [x86_64-unknown-hermit, aarch64-unknown-hermit, riscv64gc-unknown-hermit]
    steps:
      - uses: actions/checkout@v7
      - uses: mkroening/rust-toolchain-toml@main
      - run: rustup component add clippy
      - run: rustup target add wasm32-wasip1 wasm32-wasip2
      - name: cargo clippy (host)
        if: matrix.target == 'x86_64-unknown-hermit'
        run: cargo clippy --workspace --exclude hermit-kernel --all-targets
      - name: cargo clippy
        run: cargo clippy -Zbuild-std=std,panic_abort --target ${{ matrix.target }} --workspace --exclude hermit-kernel --exclude hermit-macro --exclude xtask --all-targets
      - name: cargo clippy (common-os)
        if: matrix.target == 'x86_64-unknown-hermit'
        run: cargo clippy -Zbuild-std=std,panic_abort --target ${{ matrix.target }} --package hermit --features common-os
