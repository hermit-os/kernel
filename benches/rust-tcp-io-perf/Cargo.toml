[package]

name = "rust-tcp-io-perf"
edition = "2021"
readme = "README.md"

description = "A Rust program to measure bandwidth or latency over a Rust TCP connection"

[dependencies]
clap = { version ="4.6", features = ["derive"] }
core_affinity = "0.8"
hdrhist = "0.5"
hermit_bench_output = "0.1.0"

[target.'cfg(target_os = "hermit")'.dependencies]
hermit = { path = "../../crates/hermit", default-features = false }

[features]
default = ["hermit/acpi", "hermit/loader", "hermit/pci", "hermit/smp", "hermit/tcp", "hermit/udp"]

[lints]
