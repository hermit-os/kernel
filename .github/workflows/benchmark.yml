name: Benchmark

on:
  pull_request:
  push:
    branches:
      - main

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  benchmark:
    runs-on: [self-hosted, "${{ matrix.runner-tag }}"]

    strategy:
      matrix:
        include:
          - benchmark-file: .github/benchmarks/general.yaml
            benchmark-matrix-name: General
            runner-tag: benchmark1
          - benchmark-file: .github/benchmarks/misc.yaml
            benchmark-matrix-name: Misc
            runner-tag: benchmark2

    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 gh
      - uses: mkroening/rust-toolchain-toml@main
      - name: Build loader
        run: |
          cargo xtask build --target x86_64-multiboot --release
          cp target/release/hermit-loader-x86_64-multiboot ../..
        working-directory: crates/loader
      - name: Run benchmarks
        uses: hermit-os/hermit-bench@main
        id: run-bench
        with:
          benchmark-file: ${{ matrix.benchmark-file }}
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.benchmark-matrix-name }}-benchmark-results
          path: ${{ steps.run-bench.outputs.result-file }}
